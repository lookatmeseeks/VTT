<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Canvas</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: sans-serif;
            background: #222;
        }

        #canvas {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #333;
            overflow: hidden;
            cursor: default;
        }

        #world {
            position: absolute;
            left: 0;
            top: 0;
            width: 1px;
            height: 1px;
            transform-origin: 0 0;
        }

        .image-container {
            position: absolute;
            transform-origin: center center;
        }

        .image {
            display: block;
            width: 100%;
            height: 100%;
            max-width: none;
            cursor: grab;
            user-select: none;
        }

        .image:active {
            cursor: grabbing;
        }

        .image.selected {
            outline: 3px solid lightblue !important;
            outline-offset: 2px;
        }

        #delete-button {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100000;
            padding: 8px 12px;
            cursor: pointer;
        }

        .resize-handle {
            position: absolute;
            width: 18px;
            height: 18px;
            border: 3px solid black;
            background: darkblue;
            box-sizing: border-box;
            cursor: nwse-resize;
            z-index: 99999;
        }

        .rotate-handle {
            position: absolute;
            width: 18px;
            height: 18px;
            border: 3px solid black;
            background: lightblue;
            border-radius: 50%;
            box-sizing: border-box;
            cursor: grab;
            z-index: 99999;
        }

        .rotate-handle:active {
            cursor: grabbing;
        }

        .lock-handle {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2px 5px 2px 2px;
            border: 1px solid black;
            background: white;
            box-sizing: border-box;
            cursor: pointer;
            z-index: 99999;
            color: black;
            font-size: 14px;
            line-height: 18px;
        }

        .lock-handle input {
            margin: 0;
            cursor: pointer;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div id="canvas">
    <div id="world"></div>
    <button id="delete-button">Delete selected</button>
</div>

<script>
    const canvas = document.getElementById("canvas");
    const world = document.getElementById("world");
    const deleteButton = document.getElementById("delete-button");

    let viewX = 0;
    let viewY = 0;
    let zoom = 1;

    function updateView() {
        world.style.transform =
            "translate(" + viewX + "px, " + viewY + "px) scale(" + zoom + ")";
    }

    function screenToWorldX(x) {
        return (x - viewX) / zoom;
    }

    function screenToWorldY(y) {
        return (y - viewY) / zoom;
    }

    updateView();

    canvas.addEventListener("mousedown", event => {
        if (event.button !== 1) {
            return;
        }

        event.preventDefault();

        const startMouseX = event.clientX;
        const startMouseY = event.clientY;
        const startViewX = viewX;
        const startViewY = viewY;

        const pan = moveEvent => {
            viewX = startViewX + (moveEvent.clientX - startMouseX);
            viewY = startViewY + (moveEvent.clientY - startMouseY);
            updateView();
        };

        const stopPan = () => {
            document.removeEventListener("mousemove", pan);
            document.removeEventListener("mouseup", stopPan);
        };

        document.addEventListener("mousemove", pan);
        document.addEventListener("mouseup", stopPan);
    });

    canvas.addEventListener("wheel", event => {
        event.preventDefault();

        const oldZoom = zoom;
        const zoomFactor = event.deltaY < 0 ? 1.1 : 0.9;
        const newZoom = Math.min(4, Math.max(0.1, oldZoom * zoomFactor));

        const mouseX = event.clientX;
        const mouseY = event.clientY;

        viewX = mouseX - (mouseX - viewX) * (newZoom / oldZoom);
        viewY = mouseY - (mouseY - viewY) * (newZoom / oldZoom);
        zoom = newZoom;

        updateView();
    }, { passive: false });

    const SUPABASE_URL = "https://wpkbykftykssrlevutsm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_bbq3qtA1tjGvoRXpsOO0OQ_ujSswI91";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const roomId =
        new URLSearchParams(window.location.search).get("room") || "default";

    let roomState = {
        images: []
    };

    const roomChannel = supabaseClient.channel("room:" + roomId);

    async function saveRoom() {
        const { error } = await supabaseClient
            .from("rooms")
            .update({
                state: roomState,
                updated_at: new Date().toISOString()
            })
            .eq("id", roomId);

        if (error) {
            console.error("Failed to save room:", error);
            return;
        }

        const { error: broadcastError } = await roomChannel.send({
            type: "broadcast",
            event: "state",
            payload: {
                state: roomState
            }
        });

        if (broadcastError) {
            console.error("Failed to broadcast room:", broadcastError);
        }
    }

    function renderRoomState() {
        document.querySelectorAll(".image-container").forEach(container => {
            removeResizeHandle(container.querySelector(".image"));
            container.remove();
        });

        for (const imageState of roomState.images || []) {
            createImageFromState(imageState);
        }
    }

    function createImageFromState(imageState) {
        const container = document.createElement("div");
        container.className = "image-container";
        container._stateId = imageState.id || imageState.url;

        container.style.left = imageState.left + "px";
        container.style.top = imageState.top + "px";

        if (imageState.width) {
            container.style.width = imageState.width + "px";
        }

        if (imageState.height) {
            container.style.height = imageState.height + "px";
        }

        container._rotation = imageState.rotation || 0;
        container.style.transform = "rotate(" + container._rotation + "deg)";

        const image = document.createElement("img");
        image.className = "image";
        image.src = imageState.url;
        image._stateId = container._stateId;
        image._container = container;

        container.appendChild(image);
        world.appendChild(container);

        makeDraggable(image);

        return image;
    }

    async function initializeRoom() {
        const { data, error } = await supabaseClient
            .from("rooms")
            .select("state")
            .eq("id", roomId)
            .maybeSingle();

        if (error) {
            console.error("Failed to load room:", error);
            return;
        }

        if (data) {
            roomState = data.state;
            console.log("Loaded room:", roomId, roomState);
            renderRoomState();
            return;
        }

        const { data: created, error: createError } = await supabaseClient
            .from("rooms")
            .insert({
                id: roomId,
                state: roomState
            })
            .select("state")
            .single();

        if (createError) {
            console.error("Failed to create room:", createError);
            return;
        }

        roomState = created.state;
        console.log("Created room:", roomId, roomState);
    }

    roomChannel
        .on(
            "broadcast",
            { event: "state" },
            payload => {
                if (!payload.payload || !payload.payload.state) {
                    return;
                }

                roomState = payload.payload.state;
                renderRoomState();
            }
        )
        .subscribe(status => {
            console.log("Room sync:", status);
        });

    initializeRoom();

    deleteButton.addEventListener("click", async event => {
        event.stopPropagation();

        const selectedImage = document.querySelector(".image.selected");

        if (!selectedImage) {
            return;
        }

        const imageState = getImageState(selectedImage);

        if (!imageState) {
            return;
        }

        removeResizeHandle(selectedImage);
        selectedImage._container.remove();

        roomState.images = roomState.images.filter(state =>
            (state.id || state.url) !== selectedImage._stateId
        );

        await saveRoom();
    });

    canvas.addEventListener("dragover", event => {
        event.preventDefault();
    });

    canvas.addEventListener("drop", async event => {
        event.preventDefault();

        const files = event.dataTransfer.files;

        for (const file of files) {
            if (!file.type.startsWith("image/")) {
                continue;
            }

            const fileName = crypto.randomUUID() + "-" + file.name;

            const { error: uploadError } = await supabaseClient
                .storage
                .from("images")
                .upload(fileName, file);

            if (uploadError) {
                console.error("Failed to upload image:", uploadError);
                continue;
            }

            const { data: publicUrlData } = supabaseClient
                .storage
                .from("images")
                .getPublicUrl(fileName);

            console.log("Generated image URL:", publicUrlData.publicUrl);

            const imageState = {
                id: crypto.randomUUID(),
                url: publicUrlData.publicUrl,
                left: screenToWorldX(event.clientX),
                top: screenToWorldY(event.clientY),
                width: 0,
                height: 0,
                rotation: 0,
                locked: false
            };

            const image = createImageFromState(imageState);

            image.onload = async () => {
                imageState.width = image.naturalWidth;
                imageState.height = image.naturalHeight;

                roomState.images.push(imageState);
                await saveRoom();

                console.log("Saved image to room:", imageState);
            };

            image.onerror = () => {
                console.error("Image failed to load:", publicUrlData.publicUrl);
            };
        }
    });

    canvas.addEventListener("mousedown", event => {
        if (event.target === canvas) {
            document.querySelectorAll(".image.selected").forEach(image => {
                removeResizeHandle(image);
                image.classList.remove("selected");
            });
        }
    });

    function getImageState(image) {
        return roomState.images.find(state =>
            (state.id || state.url) === image._stateId
        );
    }

    async function saveImagePosition(image) {
        const imageState = getImageState(image);
        const container = image._container;

        if (!imageState || !container) {
            return;
        }

        imageState.left = parseFloat(container.style.left) || 0;
        imageState.top = parseFloat(container.style.top) || 0;
        imageState.width = container.offsetWidth;
        imageState.height = container.offsetHeight;
        imageState.rotation = container._rotation || 0;

        await saveRoom();
    }

    function makeDraggable(image) {
        const container = image._container;
        let dragging = false;
        let offsetX = 0;
        let offsetY = 0;

        image.addEventListener("mousedown", event => {
            document.querySelectorAll(".image.selected").forEach(other => {
                if (other !== image) {
                    removeResizeHandle(other);
                    other.classList.remove("selected");
                }
            });

            image.classList.add("selected");
            addResizeHandle(image);

            const imageState = getImageState(image);

            if (imageState && imageState.locked) {
                dragging = false;
                event.preventDefault();
                return;
            }

            dragging = true;

            const rect = container.getBoundingClientRect();
            offsetX = (event.clientX - rect.left) / zoom;
            offsetY = (event.clientY - rect.top) / zoom;

            event.preventDefault();
        });

        document.addEventListener("mousemove", event => {
            if (!dragging) {
                return;
            }

            container.style.left =
                screenToWorldX(event.clientX) - offsetX + "px";

            container.style.top =
                screenToWorldY(event.clientY) - offsetY + "px";
        });

        document.addEventListener("mouseup", async () => {
            if (!dragging) {
                return;
            }

            dragging = false;
            await saveImagePosition(image);
        });
    }

    function addResizeHandle(image) {
        removeResizeHandle(image);

        const container = image._container;

        const handle = document.createElement("div");
        handle.className = "resize-handle";
        handle.style.position = "absolute";
        handle.style.right = "-9px";
        handle.style.bottom = "-9px";

        const rotateHandle = document.createElement("div");
        rotateHandle.className = "rotate-handle";
        rotateHandle.style.position = "absolute";
        rotateHandle.style.left = "50%";
        rotateHandle.style.top = "-32px";
        rotateHandle.style.transform = "translateX(-50%)";

        const lockHandle = document.createElement("label");
        lockHandle.className = "lock-handle";
        lockHandle.style.position = "absolute";
        lockHandle.style.left = "-1px";
        lockHandle.style.top = "-32px";

        const lockCheckbox = document.createElement("input");
        lockCheckbox.type = "checkbox";

        const lockText = document.createElement("span");
        lockText.textContent = "Lock";

        lockHandle.appendChild(lockCheckbox);
        lockHandle.appendChild(lockText);

        const imageState = getImageState(image);
        const isLocked = imageState && imageState.locked;
        lockCheckbox.checked = !!isLocked;

        handle.style.display = isLocked ? "none" : "block";
        rotateHandle.style.display = isLocked ? "none" : "block";
        lockHandle.title = isLocked ? "Unlock image" : "Lock image";

        // These controls are children of the image container.
        // No screen/world coordinate conversion is needed for their placement.
        container.appendChild(handle);
        container.appendChild(rotateHandle);
        container.appendChild(lockHandle);

        const updateHandle = () => {
            if (!image.classList.contains("selected")) {
                removeResizeHandle(image);
                return;
            }

            const currentImageState = getImageState(image);
            const currentLocked = currentImageState && currentImageState.locked;

            handle.style.display = currentLocked ? "none" : "block";
            rotateHandle.style.display = currentLocked ? "none" : "block";
            lockCheckbox.checked = !!currentLocked;
            lockHandle.title = currentLocked ? "Unlock image" : "Lock image";
        };

        lockHandle.addEventListener("mousedown", event => {
            event.preventDefault();
            event.stopPropagation();
        });

        lockCheckbox.addEventListener("change", async event => {
            event.stopPropagation();

            const currentImageState = getImageState(image);

            if (!currentImageState) {
                return;
            }

            currentImageState.locked = lockCheckbox.checked;
            updateHandle();
            await saveRoom();
        });

        rotateHandle.addEventListener("mousedown", event => {
            event.preventDefault();
            event.stopPropagation();

            const rect = container.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const startAngle = Math.atan2(
                event.clientY - centerY,
                event.clientX - centerX
            );

            const currentRotation = container._rotation || 0;

            const rotate = moveEvent => {
                const angle = Math.atan2(
                    moveEvent.clientY - centerY,
                    moveEvent.clientX - centerX
                );

                const delta = (angle - startAngle) * 180 / Math.PI;
                container._rotation = currentRotation + delta;
                container.style.transform = "rotate(" + container._rotation + "deg)";
            };

            const stopRotate = async () => {
                document.removeEventListener("mousemove", rotate);
                document.removeEventListener("mouseup", stopRotate);
                await saveImagePosition(image);
            };

            document.addEventListener("mousemove", rotate);
            document.addEventListener("mouseup", stopRotate);
        });

        handle.addEventListener("mousedown", event => {
            event.preventDefault();
            event.stopPropagation();

            const startWidth = container.offsetWidth;
            const startHeight = container.offsetHeight;
            const aspectRatio = startWidth / startHeight;

            const rect = container.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const angle = (container._rotation || 0) * Math.PI / 180;

            const cornerLength = Math.hypot(startWidth / 2, startHeight / 2);
            const cornerAngle = Math.atan2(startHeight / 2, startWidth / 2) + angle;
            const cornerDirectionX = Math.cos(cornerAngle);
            const cornerDirectionY = Math.sin(cornerAngle);

            const resize = moveEvent => {
                const pointerX = moveEvent.clientX - centerX;
                const pointerY = moveEvent.clientY - centerY;

                const projectedLength =
                    pointerX * cornerDirectionX +
                    pointerY * cornerDirectionY;

                const scale = projectedLength / (cornerLength * zoom);
                const newWidth = Math.max(20, startWidth * scale);
                const newHeight = newWidth / aspectRatio;

                container.style.width = newWidth + "px";
                container.style.height = newHeight + "px";

                container.style.left =
                    (screenToWorldX(centerX) - newWidth / 2) + "px";

                container.style.top =
                    (screenToWorldY(centerY) - newHeight / 2) + "px";
            };

            const stopResize = async () => {
                document.removeEventListener("mousemove", resize);
                document.removeEventListener("mouseup", stopResize);
                await saveImagePosition(image);
            };

            document.addEventListener("mousemove", resize);
            document.addEventListener("mouseup", stopResize);
        });

        image._resizeHandle = handle;
        image._rotateHandle = rotateHandle;
        image._lockHandle = lockHandle;
        image._updateResizeHandle = updateHandle;

        updateHandle();
    }

    function updateResizeHandle(image) {
        if (image._updateResizeHandle) {
            image._updateResizeHandle();
        }
    }

</script>

</body>
</html>
