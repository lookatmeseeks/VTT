<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Canvas</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: sans-serif;
            background: #222;
        }

        #canvas {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #333;
            overflow: hidden;
        }

        .image {
            position: absolute;
            max-width: none;
            cursor: grab;
            user-select: none;
        }

        .image:active {
            cursor: grabbing;
        }

        .image.selected {
            outline: 3px solid red !important;
            outline-offset: 2px;
        }

        .resize-handle {
            position: absolute;
            width: 18px;
            height: 18px;
            border: 3px solid black;
            background: yellow;
            box-sizing: border-box;
            cursor: nwse-resize;
            z-index: 99999;
        }

        .rotate-handle {
            position: absolute;
            width: 18px;
            height: 18px;
            border: 3px solid black;
            background: orange;
            border-radius: 50%;
            box-sizing: border-box;
            cursor: grab;
            z-index: 99999;
        }

        .rotate-handle:active {
            cursor: grabbing;
        }
    </style>
</head>

<body>

<div id="canvas"></div>

<script>
    const canvas = document.getElementById("canvas");

    canvas.addEventListener("dragover", event => {
        event.preventDefault();
    });

    canvas.addEventListener("drop", event => {
        event.preventDefault();

        const files = event.dataTransfer.files;

        for (const file of files) {
            if (!file.type.startsWith("image/")) {
                continue;
            }

            const image = document.createElement("img");

            image.className = "image";
            image.src = URL.createObjectURL(file);

            image.style.left = event.clientX + "px";
            image.style.top = event.clientY + "px";

            canvas.appendChild(image);

            makeDraggable(image);
        }
    });

    canvas.addEventListener("mousedown", event => {
        if (event.target === canvas) {
            document.querySelectorAll(".image.selected").forEach(image => {
                removeResizeHandle(image);
                image.classList.remove("selected");
            });
        }
    });

    function makeDraggable(image) {
        let dragging = false;
        let offsetX = 0;
        let offsetY = 0;

        image.addEventListener("mousedown", event => {
            document.querySelectorAll(".image.selected").forEach(other => {
                removeResizeHandle(other);
                other.classList.remove("selected");
            });

            image.classList.add("selected");
            addResizeHandle(image);

            dragging = true;

            const rect = image.getBoundingClientRect();

            offsetX = event.clientX - rect.left;
            offsetY = event.clientY - rect.top;

            event.preventDefault();
        });

        document.addEventListener("mousemove", event => {
            if (!dragging) {
                return;
            }

            image.style.left =
                (event.clientX - offsetX) + "px";

            image.style.top =
                (event.clientY - offsetY) + "px";

            updateResizeHandle(image);
        });

        document.addEventListener("mouseup", () => {
            dragging = false;
        });
    }

    function addResizeHandle(image) {
        removeResizeHandle(image);

        const handle = document.createElement("div");
        handle.className = "resize-handle";

        const rotateHandle = document.createElement("div");
        rotateHandle.className = "rotate-handle";

        handle.style.display = "block";
        rotateHandle.style.display = "block";

        canvas.appendChild(handle);
        canvas.appendChild(rotateHandle);

        const updateHandle = () => {
            if (!image.classList.contains("selected")) {
                removeResizeHandle(image);
                return;
            }

            const rect = image.getBoundingClientRect();

            const canvasRect = canvas.getBoundingClientRect();

            handle.style.left =
                (rect.right - canvasRect.left - 9) + "px";

            handle.style.top =
                (rect.bottom - canvasRect.top - 9) + "px";

            rotateHandle.style.left =
                (rect.left - canvasRect.left + rect.width / 2 - 9) + "px";

            rotateHandle.style.top =
                (rect.top - canvasRect.top - 32) + "px";
        };

        rotateHandle.addEventListener("mousedown", event => {
            event.preventDefault();
            event.stopPropagation();

            const rect = image.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const startAngle = Math.atan2(
                event.clientY - centerY,
                event.clientX - centerX
            );

            const currentRotation = image._rotation || 0;

            const rotate = moveEvent => {
                const angle = Math.atan2(
                    moveEvent.clientY - centerY,
                    moveEvent.clientX - centerX
                );

                const delta = (angle - startAngle) * 180 / Math.PI;
                image._rotation = currentRotation + delta;
                image.style.transform = "rotate(" + image._rotation + "deg)";

                updateHandle();
            };

            const stopRotate = () => {
                document.removeEventListener("mousemove", rotate);
                document.removeEventListener("mouseup", stopRotate);
            };

            document.addEventListener("mousemove", rotate);
            document.addEventListener("mouseup", stopRotate);
        });

        handle.addEventListener("mousedown", event => {
            event.preventDefault();
            event.stopPropagation();

            const startX = event.clientX;
            const startWidth = image.offsetWidth;
            const startHeight = image.offsetHeight;
            const aspectRatio = startWidth / startHeight;

            const resize = moveEvent => {
                const newWidth = Math.max(
                    20,
                    startWidth + (moveEvent.clientX - startX)
                );

                image.style.width = newWidth + "px";
                image.style.height = (newWidth / aspectRatio) + "px";

                updateHandle();
            };

            const stopResize = () => {
                document.removeEventListener("mousemove", resize);
                document.removeEventListener("mouseup", stopResize);
            };

            document.addEventListener("mousemove", resize);
            document.addEventListener("mouseup", stopResize);
        });

        image._resizeHandle = handle;
        image._rotateHandle = rotateHandle;
        image._updateResizeHandle = updateHandle;

        updateHandle();
    }

    function updateResizeHandle(image) {
        if (image._updateResizeHandle) {
            image._updateResizeHandle();
        }
    }

    function removeResizeHandle(image) {
        if (image._resizeHandle) {
            image._resizeHandle.remove();
            image._resizeHandle = null;
        }

        if (image._rotateHandle) {
            image._rotateHandle.remove();
            image._rotateHandle = null;
        }

        image._updateResizeHandle = null;
    }
</script>

</body>
</html>
