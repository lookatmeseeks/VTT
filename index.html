<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Canvas</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: sans-serif;
            background: #222;
        }

        #canvas {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #333;
            overflow: hidden;
        }

        .image-container {
            position: absolute;
            transform-origin: center center;
        }

        .image-container img {
            display: block;
            width: 100%;
            height: 100%;
            user-select: none;
            pointer-events: none;
        }

        .image-container.selected {
            outline: 2px solid white;
        }

        .handle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: white;
            border: 1px solid black;
            box-sizing: border-box;
            display: none;
        }

        .selected .handle {
            display: block;
        }

        .resize-handle {
            right: -7px;
            bottom: -7px;
            cursor: nwse-resize;
        }

        .rotate-handle {
            left: 50%;
            top: -35px;
            transform: translateX(-50%);
            border-radius: 50%;
            cursor: grab;
        }

        .rotate-line {
            position: absolute;
            left: 50%;
            top: -24px;
            width: 1px;
            height: 24px;
            background: white;
            display: none;
        }

        .selected .rotate-line {
            display: block;
        }
    </style>
</head>

<body>

<div id="canvas"></div>

<script>
    const canvas = document.getElementById("canvas");

    let selected = null;

    canvas.addEventListener("dragover", event => {
        event.preventDefault();
    });

    canvas.addEventListener("drop", event => {
        event.preventDefault();

        const files = event.dataTransfer.files;

        for (const file of files) {
            if (!file.type.startsWith("image/")) {
                continue;
            }

            const image = document.createElement("img");

            image.onload = () => {
                const container = document.createElement("div");

                container.className = "image-container";

                container.style.width = image.naturalWidth + "px";
                container.style.height = image.naturalHeight + "px";

                container.style.left =
                    (event.clientX - image.naturalWidth / 2) + "px";

                container.style.top =
                    (event.clientY - image.naturalHeight / 2) + "px";

                container.dataset.rotation = "0";

                image.src = URL.createObjectURL(file);

                container.appendChild(image);

                const resizeHandle = document.createElement("div");
                resizeHandle.className = "handle resize-handle";

                const rotateHandle = document.createElement("div");
                rotateHandle.className = "handle rotate-handle";

                const rotateLine = document.createElement("div");
                rotateLine.className = "rotate-line";

                container.appendChild(resizeHandle);
                container.appendChild(rotateHandle);
                container.appendChild(rotateLine);

                canvas.appendChild(container);

                makeInteractive(container);
            };
        }
    });

    canvas.addEventListener("mousedown", event => {
        if (event.target === canvas) {
            deselect();
        }
    });

    function select(container) {
        if (selected) {
            selected.classList.remove("selected");
        }

        selected = container;
        selected.classList.add("selected");
    }

    function deselect() {
        if (!selected) {
            return;
        }

        selected.classList.remove("selected");
        selected = null;
    }

    function makeInteractive(container) {
        const image = container.querySelector("img");
        const resizeHandle = container.querySelector(".resize-handle");
        const rotateHandle = container.querySelector(".rotate-handle");

        container.addEventListener("mousedown", event => {
            if (
                event.target === resizeHandle ||
                event.target === rotateHandle
            ) {
                return;
            }

            select(container);

            const startX = event.clientX;
            const startY = event.clientY;

            const startLeft = container.offsetLeft;
            const startTop = container.offsetTop;

            function move(event) {
                container.style.left =
                    startLeft + (event.clientX - startX) + "px";

                container.style.top =
                    startTop + (event.clientY - startY) + "px";
            }

            function stop() {
                document.removeEventListener("mousemove", move);
                document.removeEventListener("mouseup", stop);
            }

            document.addEventListener("mousemove", move);
            document.addEventListener("mouseup", stop);

            event.preventDefault();
        });

        resizeHandle.addEventListener("mousedown", event => {
            select(container);

            const startX = event.clientX;
            const startWidth = container.offsetWidth;
            const startHeight = container.offsetHeight;

            function resize(event) {
                const newWidth =
                    Math.max(20, startWidth + (event.clientX - startX));

                const ratio = startHeight / startWidth;

                container.style.width = newWidth + "px";
                container.style.height = (newWidth * ratio) + "px";
            }

            function stop() {
                document.removeEventListener("mousemove", resize);
                document.removeEventListener("mouseup", stop);
            }

            document.addEventListener("mousemove", resize);
            document.addEventListener("mouseup", stop);

            event.preventDefault();
            event.stopPropagation();
        });

        rotateHandle.addEventListener("mousedown", event => {
            select(container);

            const rect = container.getBoundingClientRect();

            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            function rotate(event) {
                const angle =
                    Math.atan2(
                        event.clientY - centerY,
                        event.clientX - centerX
                    ) * 180 / Math.PI;

                const rotation = angle + 90;

                container.dataset.rotation = rotation;

                container.style.transform =
                    `rotate(${rotation}deg)`;
            }

            function stop() {
                document.removeEventListener("mousemove", rotate);
                document.removeEventListener("mouseup", stop);
            }

            document.addEventListener("mousemove", rotate);
            document.addEventListener("mouseup", stop);

            event.preventDefault();
            event.stopPropagation();
        });
    }
</script>

</body>
</html>
